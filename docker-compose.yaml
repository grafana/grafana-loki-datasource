services:
  loki:
    image: grafana/loki:3.7.7@sha256:d70e4659623f3e109af669cae76fe2a5dd5be54e2298fe8aed380d982fbc2500
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:3100/ready || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  loki-loader:
    image: python:3.14-alpine@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./tests/e2e/fixtures:/data:ro
    entrypoint:
      - sh
      - -c
      - |
        set -e
        python3 /data/load.py
        echo "Fixture data loaded successfully"
    restart: no

  grafana:
    depends_on:
      loki:
        condition: service_healthy
      loki-loader:
        condition: service_completed_successfully
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
