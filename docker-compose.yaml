services:
  loki:
    image: grafana/loki:3.7.5@sha256:f968164e718f9cbe9f5b0f967f3bb6f9cad5d95cf7ffcaf968cce06c941aed62
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:3100/ready || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  loki-loader:
    image: python:3.13-alpine@sha256:399babc8b49529dabfd9c922f2b5eea81d611e4512e3ed250d75bd2e7683f4b0
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./tests/e2e/fixtures:/data:ro
    entrypoint:
      - sh
      - -c
      - |
        set -e
        python3 /data/load.py
        echo "Fixture data loaded successfully"
    restart: no

  grafana:
    depends_on:
      loki:
        condition: service_healthy
      loki-loader:
        condition: service_completed_successfully
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
