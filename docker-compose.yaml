services:
  loki:
    image: grafana/loki:3.4.2
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:3100/ready || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  loki-loader:
    image: python:3.12-alpine
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./tests/e2e/fixtures:/data:ro
    entrypoint:
      - sh
      - -c
      - |
        set -e
        python3 /data/load.py
        echo "Fixture data loaded successfully"
    restart: no

  grafana:
    depends_on:
      loki:
        condition: service_healthy
      loki-loader:
        condition: service_completed_successfully
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    configs:
      # Serve this build in place of core Loki. Env vars can't set this, because Grafana
      # ignores GF_* overrides for sections that no ini file defines, such as [plugin.loki].
      - source: grafana_custom_ini
        target: /etc/grafana/grafana.ini

configs:
  grafana_custom_ini:
    content: |
      [plugin.loki]
      as_external = true

      # Stops Grafana 13.2+ from replacing a build older than the catalog version. The
      # replacement also deletes the files in the mounted dist/.
      [plugins]
      preinstall_auto_update = false
